# HAVOC Security Scan — a composite action that installs @havoc-security/cli
# and scans the checkout on the runner.
#
# Inputs reach the shell as environment variables, never through ${{ }}.
# This is load-bearing, not style: the runner substitutes ${{ }} into a
# `run:` body TEXTUALLY, before bash parses it, so an input interpolated that
# way is shell SOURCE rather than data. Quoting does not contain it, because
# command substitution still runs inside double quotes. Versions up to and
# including v1.0.2 interpolated `path`, `framework`, `fail-on` and
# `cli-version`; v1.0.3 passes all of them, and `cloud-url`, through `env:`.
#
# Two properties to re-check on every change here, because both are invisible
# until they are exploited:
#
#   1. No `${{ }}` appears in any `run:` body.
#   2. `cli-version` and `cloud-url` are validated before use. `cli-version`
#      reaches `npm install` as a package SPEC, where npm also accepts a git
#      URL or a tarball — so an unchecked value chooses which code runs, not
#      merely which version of it.
#
# .github/workflows/smoke.yml exercises all of this against committed
# fixtures, including a case asserting that a command substitution in `path`
# is not executed.

name: 'HAVOC Security Scan'
description: 'Framework-aware adversarial security scanning for Laravel applications'
author: 'HAVOC Security'
branding:
  icon: 'shield'
  color: 'red'

inputs:
  api-key:
    # Needs @havoc-security/cli >= 0.5.0, which is the first version with
    # `--report-to`. Below that there is no upload path at all, so the step
    # probes for the flag and warns rather than passing it: an unknown option
    # makes Commander exit BEFORE the scan, before it reads a single file —
    # and passing a flag an installed version may not accept is exactly how
    # that defect happened.
    #
    # Left unset, nothing is uploaded and no network request is made.
    description: 'HAVOC Cloud API key. Create one in your dashboard as a "CI upload only" key — it can upload scans and nothing else. Leave unset to scan without uploading.'
    required: false
  path:
    description: 'Path to scan'
    required: false
    default: '.'
  framework:
    description: 'Framework to analyse. Laravel is the only implemented value.'
    required: false
    default: 'laravel'
  fail-on:
    description: 'Minimum severity that fails the build (critical, high, medium, low)'
    required: false
    default: 'high'
  cloud-url:
    # Only consulted when api-key is set.
    description: 'HAVOC Cloud instance to upload to. Only used when api-key is set.'
    required: false
    default: 'https://havoc.cloud'
  cli-version:
    description: 'Version of @havoc-security/cli to install. Pin this for reproducible runs.'
    required: false
    default: 'latest'

outputs:
  summary:
    description: 'Full scan result as compact JSON. Omits the findings array when it would not fit in a step output; read results-path for the complete document.'
    value: ${{ steps.scan.outputs.summary }}
  results-path:
    description: 'Path to the complete JSON result on the runner, for uploading as an artifact.'
    value: ${{ steps.scan.outputs.results-path }}
  grade:
    description: 'Security grade (A-F)'
    value: ${{ steps.scan.outputs.grade }}
  findings-count:
    description: 'Total number of findings'
    value: ${{ steps.scan.outputs.findings-count }}
  critical-count:
    description: 'Number of critical findings'
    value: ${{ steps.scan.outputs.critical-count }}
  high-count:
    description: 'Number of high-severity findings'
    value: ${{ steps.scan.outputs.high-count }}
  authz-coverage-percent:
    description: 'Authorization coverage: controller actions with a detectable check'
    value: ${{ steps.scan.outputs.authz-coverage-percent }}
  route-auth-percent:
    description: 'Route-level AUTHENTICATION percentage (not the headline metric)'
    value: ${{ steps.scan.outputs.route-auth-percent }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install HAVOC CLI
      shell: bash
      env:
        CLI_VERSION: ${{ inputs.cli-version }}
      run: |
        # Through the environment, never interpolated into this script — see
        # the note on the scan step. Validated as well, because this value
        # reaches `npm install` as a package SPEC: npm accepts a git URL or a
        # tarball there, so an unchecked value chooses which code runs, not
        # merely which version.
        if ! printf '%s' "$CLI_VERSION" | grep -Eq '^([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?|latest|next|beta)$'; then
          echo "::error::cli-version must be an exact version like 1.2.3, or latest/next/beta. Got: $CLI_VERSION"
          exit 1
        fi
        npm install -g "@havoc-security/cli@$CLI_VERSION"

    - name: Run HAVOC scan
      id: scan
      shell: bash
      env:
        # The key reaches the CLI through the environment, never the command
        # line: an argument is visible in `ps` and in any `set -x` trace, and
        # a composite action cannot promise neither will happen in the job
        # around it.
        HAVOC_API_KEY: ${{ inputs.api-key }}
        # EVERY input comes through here, and none is interpolated into the
        # script below.
        #
        # `${{ }}` in a `run:` body is substituted TEXTUALLY before bash sees
        # it, so an input is shell SOURCE rather than data — and double quotes
        # do not help, because command substitution still runs inside them.
        # This step is the one that must not get it wrong: the API key is in
        # scope right here, so anything executing in this shell can read it.
        #
        # An environment variable is passed by the runner as data and expanded
        # by bash as a value. Four of these were interpolated in v1.0.2 and
        # earlier.
        SCAN_PATH: ${{ inputs.path }}
        FRAMEWORK: ${{ inputs.framework }}
        FAIL_ON: ${{ inputs.fail-on }}
        CLOUD_URL: ${{ inputs.cloud-url }}
      run: |
        set -o pipefail
        RESULTS=/tmp/havoc-results.json

        # Upload only when a key was given, and only when the installed CLI
        # can actually do it. `--report-to` landed in 0.5.0; passing it to an
        # older one makes Commander exit with "unknown option" BEFORE the scan
        # runs, rather than scanning without uploading. `cli-version` defaults
        # to `latest` but a workflow may pin anything, so the capability is
        # probed rather than assumed.
        REPORT_ARGS=()
        if [ -n "${HAVOC_API_KEY:-}" ]; then
          if ! printf '%s' "$CLOUD_URL" | grep -Eq '^https?://[^[:space:]]+$'; then
            echo "::error::cloud-url must be an http(s) URL. Got: $CLOUD_URL"
            exit 1
          fi
          if havoc scan --help 2>/dev/null | grep -q -- '--report-to'; then
            REPORT_ARGS=(--report-to "$CLOUD_URL")
          else
            echo "::warning::api-key was provided but the installed HAVOC CLI has no --report-to, so the result was not uploaded. Pin cli-version to 0.5.0 or later. The scan itself ran normally."
          fi
        fi

        # The CLI writes JSON to stdout and diagnostics to stderr. There is no
        # --output flag; passing one makes Commander exit before it scans.
        #
        # An upload fault cannot change SCAN_EXIT: the CLI decides its exit
        # code from the findings alone and reports an upload failure as a
        # warning on stderr, so a dashboard being down never fails a build.
        set +e
        havoc scan "$SCAN_PATH" \
          --framework "$FRAMEWORK" \
          --fail-on "$FAIL_ON" \
          "${REPORT_ARGS[@]}" \
          --format json > "$RESULTS"
        SCAN_EXIT=$?
        set -e

        if [ ! -s "$RESULTS" ]; then
          echo "::error::HAVOC produced no output. Scan exit code: $SCAN_EXIT"
          exit 1
        fi
        if ! jq -e . "$RESULTS" >/dev/null 2>&1; then
          echo "::error::HAVOC output was not valid JSON. Scan exit code: $SCAN_EXIT"
          exit 1
        fi

        echo "results-path=$RESULTS" >> "$GITHUB_OUTPUT"

        # Step outputs are size-capped (GitHub documents ~1 MB, counted in
        # UTF-16, for everything a job sets). Measure the COMPACT value, not
        # the pretty file the CLI writes, and keep well clear of the cap so the
        # seven other outputs below still fit. Over the threshold, publish the
        # result without findings and point consumers at results-path.
        SUMMARY_LIMIT=262144
        COMPACT=/tmp/havoc-results.compact.json
        jq -c . "$RESULTS" > "$COMPACT"
        if [ "$(wc -c < "$COMPACT")" -le "$SUMMARY_LIMIT" ]; then
          echo "summary=$(cat "$COMPACT")" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::Scan result exceeds $SUMMARY_LIMIT bytes; the summary output omits findings. Use results-path for the full document."
          echo "summary=$(jq -c 'del(.findings) + {findingsOmitted: (.findings | length)}' "$RESULTS")" >> "$GITHUB_OUTPUT"
        fi

        # Counts are derived from the findings array, which is what the CLI
        # emits. There are no totalFindings/criticalCount/highCount keys.
        echo "grade=$(jq -r '.grade // "unknown"' "$RESULTS")" >> "$GITHUB_OUTPUT"
        echo "findings-count=$(jq -r '.findings | length' "$RESULTS")" >> "$GITHUB_OUTPUT"
        echo "critical-count=$(jq -r '[.findings[] | select(.severity == "critical")] | length' "$RESULTS")" >> "$GITHUB_OUTPUT"
        echo "high-count=$(jq -r '[.findings[] | select(.severity == "high")] | length' "$RESULTS")" >> "$GITHUB_OUTPUT"
        # authorizationCoverage is the headline: controller actions with a
        # check. It is null when the scan found no controller actions.
        # coverage.routeAuthPercent is route-level AUTHENTICATION, a different
        # question, and is reported separately rather than conflated.
        echo "authz-coverage-percent=$(jq -r 'if (.authorizationCoverage.totalActions // 0) > 0 then ((.authorizationCoverage.coveredActions * 100 / .authorizationCoverage.totalActions) | floor) else 100 end' "$RESULTS")" >> "$GITHUB_OUTPUT"
        echo "route-auth-percent=$(jq -r '.coverage.routeAuthPercent // .coverage.coveragePercent // 0' "$RESULTS")" >> "$GITHUB_OUTPUT"

        # Preserve the scan's verdict so fail-on actually fails the build.
        exit $SCAN_EXIT

    - name: Write job summary
      shell: bash
      if: always()
      run: |
        RESULTS=/tmp/havoc-results.json
        {
          echo "## HAVOC Security Scan"
          if [ -s "$RESULTS" ] && jq -e . "$RESULTS" >/dev/null 2>&1; then
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Grade | **$(jq -r '.grade // "N/A"' "$RESULTS")** |"
            echo "| Authorization coverage | $(jq -r '.authorizationCoverage.coveredActions // 0' "$RESULTS")/$(jq -r '.authorizationCoverage.totalActions // 0' "$RESULTS") controller actions |"
            echo "| Route authentication | $(jq -r '.coverage.routeAuthPercent // 0' "$RESULTS")% |"
            echo "| Total findings | $(jq -r '.findings | length' "$RESULTS") |"
            echo "| Critical | $(jq -r '[.findings[] | select(.severity == "critical")] | length' "$RESULTS") |"
            echo "| High | $(jq -r '[.findings[] | select(.severity == "high")] | length' "$RESULTS") |"
            echo "| Files scanned | $(jq -r '.metadata.filesScanned // 0' "$RESULTS") |"
            echo "| Duration | $(jq -r '.metadata.durationMs // 0' "$RESULTS")ms |"
          else
            echo ""
            echo "The scan produced no usable output."
          fi
        } >> "$GITHUB_STEP_SUMMARY"
