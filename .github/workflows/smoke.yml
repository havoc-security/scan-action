# Proves the action actually runs. The published v1 was broken for months
# precisely because nothing here exercised it: it invoked the CLI with a flag
# the CLI rejects, swallowed the error, set no outputs, and could never fail a
# build. Each assertion below corresponds to one of those failures.
name: Smoke test

on:
  push:
  pull_request:
  schedule:
    # The action installs the CLI at run time, so a CLI release can break it
    # with no commit here. Catch that weekly rather than from a bug report.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocking:
    name: A high finding fails the build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: scan
        uses: ./
        continue-on-error: true
        with:
          path: tests/fixtures/vulnerable

      - name: Assert the step failed and the outputs are populated
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          GRADE: ${{ steps.scan.outputs.grade }}
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
          HIGH: ${{ steps.scan.outputs.high-count }}
          AUTHZ: ${{ steps.scan.outputs.authz-coverage-percent }}
          SUMMARY: ${{ steps.scan.outputs.summary }}
          RESULTS: ${{ steps.scan.outputs.results-path }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          # fail-on must be able to fail a build. v1 could not.
          [ "$OUTCOME" = "failure" ] || fail "expected the scan step to fail on a high finding, got '$OUTCOME'"

          # Outputs must be set at all. v1 set none.
          [ -n "$GRADE" ] && [ "$GRADE" != "unknown" ] || fail "grade was not set (got '$GRADE')"
          [ "$HIGH" -ge 1 ] || fail "expected at least one high finding, got '$HIGH'"
          [ "$FINDINGS" -ge "$HIGH" ] || fail "findings-count ($FINDINGS) < high-count ($HIGH)"
          [ "$AUTHZ" = "0" ] || fail "expected 0% authorization coverage on the fixture, got '$AUTHZ'"

          # summary must be real JSON carrying the same numbers.
          echo "$SUMMARY" | jq -e . > /dev/null || fail "summary was not valid JSON"
          IN_SUMMARY=$(echo "$SUMMARY" | jq -r '.findings | length')
          [ "$IN_SUMMARY" = "$FINDINGS" ] || fail "summary has $IN_SUMMARY findings, findings-count says $FINDINGS"

          # results-path must point at the full document.
          [ -s "$RESULTS" ] || fail "results-path '$RESULTS' is missing or empty"
          jq -e '.findings | length > 0' "$RESULTS" > /dev/null || fail "results-path holds no findings"

          echo "blocking case OK — grade $GRADE, $FINDINGS findings, $HIGH high"

  clean:
    name: Findings below the threshold do not fail the build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: scan
        uses: ./
        with:
          path: tests/fixtures/clean

      - name: Assert it passed and still reported
        env:
          GRADE: ${{ steps.scan.outputs.grade }}
          HIGH: ${{ steps.scan.outputs.high-count }}
          CRITICAL: ${{ steps.scan.outputs.critical-count }}
          AUTHZ: ${{ steps.scan.outputs.authz-coverage-percent }}
          SUMMARY: ${{ steps.scan.outputs.summary }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          # Reaching this step at all means the scan exited 0.
          [ "$HIGH" = "0" ] || fail "fixture should have no high findings, got '$HIGH'"
          [ "$CRITICAL" = "0" ] || fail "fixture should have no critical findings, got '$CRITICAL'"
          [ -n "$GRADE" ] && [ "$GRADE" != "unknown" ] || fail "grade was not set (got '$GRADE')"
          # The fixture has no controller actions, so coverage is vacuously 100%
          # — this asserts the null authorizationCoverage branch is handled.
          [ "$AUTHZ" = "100" ] || fail "expected 100% coverage for a fixture with no actions, got '$AUTHZ'"
          echo "$SUMMARY" | jq -e . > /dev/null || fail "summary was not valid JSON"

          echo "clean case OK — grade $GRADE, no high or critical findings"

  pinned:
    name: An explicit cli-version is honoured
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: scan
        uses: ./
        continue-on-error: true
        with:
          path: tests/fixtures/vulnerable
          cli-version: '0.4.1'

      - name: Assert the pinned CLI ran
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          SUMMARY: ${{ steps.scan.outputs.summary }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ "$OUTCOME" = "failure" ] || fail "expected a failure on the vulnerable fixture, got '$OUTCOME'"
          VERSION=$(echo "$SUMMARY" | jq -r '.metadata.scannerVersion // "missing"')
          [ "$VERSION" != "missing" ] || fail "no scannerVersion in the result"
          echo "pinned case OK — scanner $VERSION"

  injection:
    name: An input is data, not shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: scan
        uses: ./
        continue-on-error: true
        with:
          # Up to v1.0.2 every input was interpolated into the scan step with
          # ${{ }}, which the runner substitutes textually, so this ran as the
          # runner user. The trailing `echo .` even kept the scan working,
          # which is what made it quiet. Now the CLI receives the string.
          path: '$(id -un > /tmp/havoc-injection-canary; echo .)'

      - name: Assert nothing executed and the string was treated as a path
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          # The whole point: the substitution did not run.
          if [ -e /tmp/havoc-injection-canary ]; then
            fail "command substitution in 'path' EXECUTED — the input reached a shell as source"
          fi

          # And it was passed through as a literal path, which does not exist,
          # so the step must have failed rather than silently scanning '.'.
          [ "$OUTCOME" = "failure" ] || fail "expected the scan to reject a non-existent path, got '$OUTCOME'"

          echo "injection case OK — the input was data"

  api-key-on-an-older-cli:
    name: api-key with a CLI that cannot upload still scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: scan
        uses: ./
        with:
          path: tests/fixtures/clean
          # Below 0.5.0 there is no --report-to. Passing it anyway would make
          # Commander exit with "unknown option" before scanning a single file
          # — the defect that left v1 reporting nothing for months. The action
          # must probe, warn, and scan.
          cli-version: '0.4.1'
          api-key: 'not-a-real-key'

      - name: Assert the scan ran normally
        env:
          GRADE: ${{ steps.scan.outputs.grade }}
          SUMMARY: ${{ steps.scan.outputs.summary }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          # Reaching this step means the scan exited 0 rather than dying on an
          # unknown option.
          [ -n "$GRADE" ] && [ "$GRADE" != "unknown" ] || fail "grade was not set (got '$GRADE')"
          echo "$SUMMARY" | jq -e '.findings | length >= 0' > /dev/null || fail "summary was not a scan result"
          echo "older-CLI case OK — warned, scanned, uploaded nothing"

  upload-failure-is-not-fatal:
    name: A failed upload does not change the verdict
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: clean
            expected: success
          - fixture: vulnerable
            expected: failure
    steps:
      - uses: actions/checkout@v4

      - id: scan
        uses: ./
        continue-on-error: true
        with:
          path: tests/fixtures/${{ matrix.fixture }}
          cli-version: '0.5.0'
          api-key: 'not-a-real-key'
          # Port 9 is discard: the connection is refused immediately. This is
          # the worst case for an upload and must still be only a warning.
          cloud-url: 'http://127.0.0.1:9'

      - name: Assert the exit code came from the findings alone
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          EXPECTED: ${{ matrix.expected }}
          GRADE: ${{ steps.scan.outputs.grade }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ "$OUTCOME" = "$EXPECTED" ] || fail "upload failure changed the verdict: expected '$EXPECTED', got '$OUTCOME'"
          [ -n "$GRADE" ] && [ "$GRADE" != "unknown" ] || fail "grade was not set (got '$GRADE')"
          echo "unreachable-dashboard case OK — verdict '$OUTCOME' decided by the scan"
